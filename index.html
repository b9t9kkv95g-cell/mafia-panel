<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель Ведущего</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- HEADER / TIMER SECTION -->
        <header class="top-bar">
            <div class="timer-section">
                <div class="timer-display" id="timer">01:00</div>
                <div class="timer-controls">
                    <button id="btn-start" class="btn-icon"><i class="fas fa-play"></i></button>
                    <button id="btn-pause" class="btn-icon"><i class="fas fa-pause"></i></button>
                    <button id="btn-reset" class="btn-icon"><i class="fas fa-undo"></i></button>
                    <button id="btn-set130" class="btn-text">1:30</button>
                    <button id="btn-restart-legacy" class="btn-text" style="color: var(--accent-red);">
                        <i class="fas fa-trash"></i> Сброс
                    </button>
                </div>
            </div>
            <div class="phase-display">
                <h2>Mafia Elysium</h2>
            </div>
        </header>

        <div class="main-grid">
            <!-- LEFT COLUMN: PLAYERS -->
            <section class="players-panel">
                <div class="panel-header">
                    <h3>Игроки (1-10)</h3>
                    <button id="btn-shuffle" class="btn-small"><i class="fas fa-random"></i> Шафл ролей</button>
                </div>
                <div class="players-header-row">
                    <span>#</span>
                    <span>Ник</span>
                    <span>Роль</span>
                    <span>ФОЛЛ/ПРЕД/ПОДНЯТИЕ</span>
                </div>
                <div class="players-list" id="players-list"></div>
            </section>

            <!-- RIGHT COLUMN: CONTROL PANEL -->
            <section class="control-panel">
                <!-- ГОЛОСОВАНИЕ -->
                <div class="voting-box glass-panel">
                    <h3>Голосование</h3>
                    <div class="voting-candidates">
                        <span style="color: var(--text-secondary); font-size: 0.85rem;">Порядок:</span>
                        <div id="voting-order-display" class="order-sequence"></div>
                    </div>
                    <div class="voting-buttons" id="voting-buttons"></div>
                </div>

                <!-- НОЧНЫЕ ДЕЙСТВИЯ -->
                <div class="night-box glass-panel">
                    <h3>Ночные действия</h3>
                    <div class="night-grid">
                        <div class="night-action">
                            <label class="mafia-label"><i class="fas fa-crosshairs"></i> Мафия:</label>
                            <select id="action-mafia" class="player-select"></select>
                        </div>
                        <div class="night-action">
                            <label class="don-label"><i class="fas fa-chess-king"></i> Дон:</label>
                            <select id="action-don" class="player-select"></select>
                        </div>
                        <div class="night-action">
                            <label class="sheriff-label"><i class="fas fa-star"></i> Шериф:</label>
                            <select id="action-sheriff" class="player-select"></select>
                        </div>
                        <div class="night-action">
                            <label class="doc-label"><i class="fas fa-briefcase-medical"></i> Доктор:</label>
                            <select id="action-doc" class="player-select"></select>
                        </div>
                    </div>
                    <button id="btn-process-night" class="btn-full-width">Применить ночь</button>
                    <div id="night-result" style="margin-top: 10px; font-size: 0.85rem; min-height: 20px;"></div>
                </div>

                <!-- ЗАМЕТКИ -->
                <div class="notes-box glass-panel">
                    <h3>Заметки</h3>
                    <textarea id="game-notes" placeholder="Ваши мысли и записи..."></textarea>
                </div>
            </section>
        </div>
    </div>

    <!-- Аудио для сигнала таймера -->
    <audio id="timer-beep" preload="auto">
        <source src="https://assets.mixkit.co/sfx/preview/mixkit-alarm-digital-clock-beep-989.mp3" type="audio/mpeg">
    </audio>

    <script src="app.js"></script>
</body>
</html>
